name: Betamax report
# Never check out PR code or restore its caches in either reporting mode.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Betamax]
    types: [completed]
permissions: {}
concurrency:
  group:
    betamax-report-${{ github.event.workflow_run.head_repository.id }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Gallery links
        uses: joshka/betamax-action/report@23bc495e75ddd3c0997cf7a1bf80db1c22bbb53b # independent report comments
        with:
          workflow: betamax.yml
      - name: Native attachments
        id: native
        uses: joshka/betamax-action/report@23bc495e75ddd3c0997cf7a1bf80db1c22bbb53b # independent report comments
        with:
          workflow: betamax.yml
          comment-key: betamax-native
          artifact-key: betamax
          mode: attachments
          attachment-token: ${{ secrets.BETAMAX_ATTACHMENT_TOKEN }}
      - name: Verify native uploads succeeded
        if: steps.native.outputs.comment-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_URL: ${{ steps.native.outputs.comment-url }}
        run: |
          comment_id="${COMMENT_URL##*#issuecomment-}"
          gh api "repos/$REPOSITORY/issues/comments/$comment_id" --jq '.body' > "$RUNNER_TEMP/native-comment.md"
          grep -q 'https://github.com/user-attachments/assets/' "$RUNNER_TEMP/native-comment.md"
          if grep -q 'could not be attached' "$RUNNER_TEMP/native-comment.md"; then
            echo 'Some native uploads failed; inspect the reporter warnings.'
            exit 1
          fi
