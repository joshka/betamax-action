name: Betamax report
# Metadata-only by default. Never check out PR code or restore its caches here.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Betamax]
    types: [completed]
permissions: {}
concurrency:
  group:
    betamax-report-${{ github.event.workflow_run.head_repository.id }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: joshka/betamax-action/report@0bc254d5ae6e0db21c8254c4230f270bffcd61a2 # initial implementation
        with:
          workflow: betamax.yml
