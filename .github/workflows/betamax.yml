name: Betamax
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: betamax-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: images
            formats: gif,png,webp
          - variant: video
            formats: mp4,webm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Build the demo
        run: cargo build --locked --manifest-path examples/ratatui/Cargo.toml
      - name: Render terminal previews
        id: previews
        uses: $/
        with:
          tapes: examples/tapes/*.tape
          formats: ${{ matrix.formats }}
          variant: ${{ matrix.variant }}
          extra-outputs: .artifacts/demo-checkpoint.png
      - name: Verify media dimensions and playback timing
        env:
          BETAMAX_OUTPUT_DIRECTORY: ${{ steps.previews.outputs.output-directory }}
        run: node scripts/verify-media.mjs
