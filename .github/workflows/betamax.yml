name: Betamax
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: betamax-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: images
            os: ubuntu-24.04
            formats: gif,png,webp
          - variant: video
            os: ubuntu-24.04
            formats: mp4,webm
          - variant: arm
            os: ubuntu-24.04-arm
            formats: gif,png,webp
          - variant: local
            os: ubuntu-24.04
            formats: webp
            binary: .artifacts/local-cli/betamax
            version: must-not-download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Build the demo
        run: cargo build --locked --manifest-path examples/ratatui/Cargo.toml
      - name: Prepare the local executable fixture
        if: matrix.binary != ''
        run: node scripts/prepare-local-binary.mjs
      - name: Render terminal previews
        id: previews
        uses: $/
        with:
          binary: ${{ matrix.binary }}
          version: ${{ matrix.version || '0.1.20' }}
          tapes: examples/tapes/*.tape
          formats: ${{ matrix.formats }}
          variant: ${{ matrix.variant }}
          extra-outputs: .artifacts/demo-checkpoint.png
      - name: Install the independent image decoder
        run: sudo apt-get install -y python3-pil
      - name: Verify media dimensions and playback timing
        env:
          BETAMAX_OUTPUT_DIRECTORY: ${{ steps.previews.outputs.output-directory }}
          BETAMAX_EXPECTED_FORMATS: ${{ matrix.formats }}
        run: node scripts/verify-media.mjs
      - name: Verify the supplied executable ran
        if: matrix.binary != ''
        run: test -f .artifacts/local-binary-used
